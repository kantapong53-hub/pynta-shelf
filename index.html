<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pynta Diary — ชั้นวางของใช้น้องพินตา</title>
<meta name="description" content="ชั้นวางของใช้น้องพินตา — ของที่ใช้จริงในแต่ละช่วงวัย ตั้งแต่แรกเกิดจนโต">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&display=swap">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}
:root{
  --paper:#F7F2EE;
  --paper-2:#F0E6E1;
  --surface:#FFFCFA;
  --surface-2:#F4E9E6;
  --ink:#34252A;
  --ink-2:#6E5B60;
  --ink-3:#A0898D;
  --line:#E6D8D3;
  --line-2:#DCC7C4;
  --accent:#B04A63;
  --accent-soft:#F2DCE1;
  --sage:#7D8A6C;
  --shopee:#EE4D2D;
  --lazada:#2B32A8;
  --shadow:0 1px 1px rgba(52,37,42,.04), 0 10px 26px -18px rgba(52,37,42,.5);
  --radius:13px;
  --maxw:1120px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#211A1C;
    --paper-2:#2A2124;
    --surface:#2B2226;
    --surface-2:#3A2C31;
    --ink:#F3E9E7;
    --ink-2:#C6B2B4;
    --ink-3:#95807F;
    --line:#3E3033;
    --line-2:#513E42;
    --accent:#E894A8;
    --accent-soft:#4A3138;
    --sage:#A3B08E;
    --shopee:#FF8A6B;
    --lazada:#9AA0F5;
    --shadow:0 1px 1px rgba(0,0,0,.3), 0 12px 30px -20px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --paper:#211A1C;
  --paper-2:#2A2124;
  --surface:#2B2226;
  --surface-2:#3A2C31;
  --ink:#F3E9E7;
  --ink-2:#C6B2B4;
  --ink-3:#95807F;
  --line:#3E3033;
  --line-2:#513E42;
  --accent:#E894A8;
  --accent-soft:#4A3138;
  --sage:#A3B08E;
  --shopee:#FF8A6B;
  --lazada:#9AA0F5;
  --shadow:0 1px 1px rgba(0,0,0,.3), 0 12px 30px -20px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper);
  background-image:radial-gradient(120% 60% at 50% 0%, var(--surface) 0%, transparent 60%);
  color:var(--ink);
  font-family:"IBM Plex Sans Thai Looped","Segoe UI",system-ui,sans-serif;
  font-size:15px;line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}

/* measuring-tape ribbon */
.tape{
  height:24px;background:var(--accent-soft);
  background-image:
    repeating-linear-gradient(to right, color-mix(in srgb, var(--accent) 45%, transparent) 0 1px, transparent 1px 11px),
    repeating-linear-gradient(to right, color-mix(in srgb, var(--accent) 70%, transparent) 0 1px, transparent 1px 55px);
  background-size:100% 8px, 100% 14px;
  background-position:left bottom,left bottom;background-repeat:repeat-x;
  border-bottom:1px solid var(--line-2);
}

/* masthead */
header.masthead{padding:38px 0 24px}
.brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:22px;flex-wrap:wrap}
.wordmark{
  font-family:Fraunces,Georgia,serif;font-weight:600;
  font-size:clamp(36px,5.6vw,58px);letter-spacing:-.025em;line-height:.98;margin:0;
  text-wrap:balance;
}
.wordmark em{font-style:italic;font-weight:400;color:var(--accent)}
.tagline{margin:12px 0 0;color:var(--ink-2);max-width:54ch}
.tagline .en{display:block;color:var(--ink-3);font-size:13px;margin-top:2px}
.headmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.counts{display:flex;gap:30px;margin-top:24px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.count{display:flex;align-items:baseline;gap:9px}
.count b{font-family:Fraunces,Georgia,serif;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent)}
.count span{color:var(--ink-3);font-size:12.5px;letter-spacing:.05em;text-transform:uppercase}

/* controls */
.controls{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb, var(--paper) 90%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:10px 0;
}
.ctrlrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pills{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 100%}
@media (min-width:1080px){.pills{flex:1 1 auto}}
.pill{
  white-space:nowrap;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:5px 14px;font-size:13.5px;color:var(--ink-2);cursor:pointer;
  transition:background .15s,color .15s,border-color .15s;
}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
input.search{
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:6px 15px;min-width:150px;flex:0 1 210px;
}
input.search::placeholder{color:var(--ink-3)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn-primary:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-ghost{border-color:transparent;background:transparent;color:var(--ink-3)}
.btn-ghost:hover{color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* section tabs */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:0}
.tab{
  border:0;background:none;padding:11px 15px 10px;font-size:14.5px;font-weight:500;
  color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
  border-radius:8px 8px 0 0;
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-size:11.5px;color:var(--ink-3);margin-left:6px;font-variant-numeric:tabular-nums}

.sectionhead{margin:30px 0 4px}
.sectionhead .en{color:var(--sage);font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:500}
.sectionhead h2{margin:2px 0 0;font-family:Fraunces,Georgia,serif;font-size:27px;font-weight:600;letter-spacing:-.01em}
.sectionhead p{margin:6px 0 0;color:var(--ink-2);font-size:14px;max-width:62ch}
.headrow{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}

/* deals */
.dealbanner{
  display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  margin:14px 0 0;padding:11px 16px;border-radius:var(--radius);
  background:var(--accent-soft);border:1px solid var(--line-2);font-size:13.5px;color:var(--ink);
}
.dealbanner b{font-weight:600}
.dealcard{position:relative}
.dealcard .icon{border-radius:var(--radius) var(--radius) 0 0}
.dealtag{
  position:absolute;top:10px;left:10px;z-index:2;font-size:10.5px;font-weight:600;
  letter-spacing:.04em;background:var(--accent);color:#fff;border-radius:999px;padding:3px 9px;
  box-shadow:0 2px 8px -2px rgba(52,37,42,.5);
}
.dealcard.over{opacity:.55}
.dealcard.over .dealtag{background:var(--ink-3)}
.priceline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pricenow{font-family:Fraunces,Georgia,serif;font-size:19px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.pricewas{font-size:12.5px;color:var(--ink-3);text-decoration:line-through;font-variant-numeric:tabular-nums}
.dealcode{
  display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:12px;
  border:1px dashed var(--line-2);border-radius:6px;padding:2px 8px;background:var(--surface-2);
  color:var(--ink);letter-spacing:.04em;
}
.pricenote{font-size:11.5px;color:var(--ink-3);margin:0}

/* checklist */
.progwrap{display:flex;align-items:center;gap:12px;margin:20px 0 6px;flex-wrap:wrap}
.progbar{flex:1 1 220px;height:7px;background:var(--surface-2);border-radius:999px;overflow:hidden;min-width:160px}
.progbar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s ease}
.progtext{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.clgroup{margin-top:26px}
.clgroup h3{
  margin:0 0 10px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--sage);font-weight:600;
}
.clrow{
  display:flex;gap:13px;align-items:flex-start;padding:11px 13px;background:var(--surface);
  border:1px solid var(--line);border-radius:11px;margin-bottom:8px;
}
.clrow.done{background:transparent;border-style:dashed}
.clrow.done .cltitle{text-decoration:line-through;color:var(--ink-3)}
.clbox{
  flex:0 0 21px;width:21px;height:21px;margin-top:2px;border:1.5px solid var(--line-2);
  border-radius:6px;background:var(--paper);cursor:pointer;display:grid;place-items:center;
  color:transparent;font-size:12px;line-height:1;padding:0;
}
.clbox[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.clmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.cltitle{margin:0;font-weight:600;font-size:14.5px}
.clnote{margin:0;font-size:12.5px;color:var(--ink-2)}
.clside{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

/* skipped */
.skiplist{display:grid;gap:10px;margin-top:18px}
.skiprow{
  border:1px solid var(--line);border-left:3px solid var(--line-2);
  border-radius:11px;padding:13px 15px;background:var(--surface);
}
.skiprow h4{margin:0 0 4px;font-size:14.5px;font-weight:600}
.skiprow p{margin:0;font-size:13px;color:var(--ink-2)}
.skipinstead{margin-top:7px;font-size:12.5px;color:var(--accent)}

/* gifts */
.giftbudget{margin-top:28px}
.giftbudget h3{
  margin:0 0 12px;font-family:Fraunces,Georgia,serif;font-size:19px;font-weight:600;
  display:flex;align-items:baseline;gap:10px;
}
.giftbudget h3 small{font-family:"IBM Plex Sans Thai Looped",sans-serif;font-size:12px;color:var(--ink-3);font-weight:400}

.notice{
  margin:16px 0 0;padding:11px 15px;border:1px dashed var(--line-2);background:var(--surface-2);
  border-radius:var(--radius);color:var(--ink-2);font-size:13.5px;
  display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;
}

/* stages + ruler */
main{padding:8px 0 80px}
.stage{display:grid;grid-template-columns:176px minmax(0,1fr);padding-top:36px}
.rail{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.rail::before{content:"";position:absolute;left:31px;top:16px;bottom:-36px;width:1px;background:var(--line-2)}
.rail::after{content:"";position:absolute;left:21px;top:48px;bottom:-36px;width:10px;
  background-image:repeating-linear-gradient(to bottom, var(--line-2) 0 1px, transparent 1px 16px)}
.stage:last-child .rail::before,.stage:last-child .rail::after{bottom:auto;height:0}
.notch{
  position:relative;z-index:1;width:62px;height:62px;border-radius:50%;
  background:var(--surface);border:1px dashed var(--line-2);
  display:grid;place-content:center;text-align:center;line-height:1.05;
  box-shadow:0 0 0 5px var(--paper);
}
.notch b{font-family:Fraunces,Georgia,serif;font-size:20px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.notch span{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
/* cover photo */
.cover{margin:6px 0 2px}
.coverframe{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:9px;box-shadow:var(--shadow);
}
.coverframe img{display:block;width:100%;height:clamp(170px,26vw,330px);object-fit:cover;border-radius:6px}
.coverdrop{
  border:1px dashed var(--line-2);border-radius:var(--radius);background:var(--surface-2);
  min-height:120px;display:grid;place-items:center;color:var(--ink-3);font-size:13.5px;cursor:pointer;
}
.coverdrop:hover{border-color:var(--accent);color:var(--accent)}
.photoacts{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}

/* stage polaroid — pinned on the timeline, under the notch */
.stagehead{padding:8px 0 16px}
.stagetext{min-width:0}
.polaroid{
  position:relative;z-index:1;width:150px;background:var(--surface);border:1px solid var(--line);
  padding:8px 8px 10px;border-radius:4px;box-shadow:var(--shadow);transform:rotate(-1.4deg);
  transform-origin:top left;cursor:default;
}
.stage:nth-child(even) .polaroid{transform:rotate(1.2deg)}
.polaroid img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:2px}
.polaroid figcaption{
  font-family:Fraunces,Georgia,serif;font-style:italic;font-size:12px;color:var(--ink-3);
  text-align:center;margin-top:7px;
}
.photodrop{
  position:relative;z-index:1;width:150px;min-height:104px;border:1px dashed var(--line-2);border-radius:8px;
  background:var(--surface-2);color:var(--ink-3);font-size:12.5px;cursor:pointer;
  display:grid;place-items:center;text-align:center;padding:10px;
}
.photodrop:hover{border-color:var(--accent);color:var(--accent)}
.stagehead h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em}
.stagehead .en{color:var(--sage);font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:500}
.stagehead p{margin:5px 0 0;color:var(--ink-2);font-size:14px;max-width:58ch}

.stage.anystage{margin-top:38px;border-top:1px dashed var(--line-2)}
.stage.anystage .rail::before,.stage.anystage .rail::after{display:none}
.stage.anystage .notch{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.stage.anystage .notch b{color:var(--accent);font-size:27px;line-height:1}

/* product cards — mounted prints */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(162px,1fr))}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  display:flex;flex-direction:column;box-shadow:var(--shadow);
  transition:transform .18s ease, box-shadow .18s ease;
}
.card:hover{transform:translateY(-3px);box-shadow:0 2px 3px rgba(52,37,42,.05),0 18px 34px -20px rgba(52,37,42,.65)}
.icon{
  position:relative;aspect-ratio:1;width:100%;padding:8px;background:var(--surface);
  border-bottom:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0;
}
.icon .frame{position:relative;width:100%;height:100%;overflow:hidden;border-radius:5px;background:var(--surface-2);display:grid;place-items:center}
.urlnote{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.icon img{width:100%;height:100%;object-fit:cover;display:block}
/* album photo corners */
.icon::before,.icon::after{
  content:"";position:absolute;width:14px;height:14px;border:2px solid var(--accent-soft);pointer-events:none;
}
.icon::before{top:4px;left:4px;border-right:0;border-bottom:0;border-radius:3px 0 0 0}
.icon::after{bottom:4px;right:4px;border-left:0;border-top:0;border-radius:0 0 3px 0}
.mono{font-family:Fraunces,Georgia,serif;font-size:42px;font-weight:400;font-style:italic;color:var(--accent)}
.cbody{padding:12px 13px 6px;display:flex;flex-direction:column;gap:6px;flex:1}
.cat{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--sage);font-weight:500}
.cname{font-weight:600;font-size:14.5px;line-height:1.36;margin:0}
.cen{font-size:12px;color:var(--ink-3);margin:0;font-family:Fraunces,Georgia,serif;font-style:italic}
.cnote{font-size:12.5px;color:var(--ink-2);margin:0}
.links{display:flex;gap:6px;margin-top:auto;padding-top:9px;flex-wrap:wrap}
.shop{
  text-decoration:none;font-size:12px;font-weight:500;border-radius:8px;padding:5px 10px;
  border:1px solid var(--line);color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;background:var(--surface);
}
.shop .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.shop.sp .dot{background:var(--shopee)}
.shop.lz .dot{background:var(--lazada)}
.shop:hover{border-color:var(--ink);color:var(--ink)}
.cardfoot{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:0 13px 11px}
.tiny{font-size:11.5px;color:var(--ink-3);background:none;border:0;cursor:pointer;padding:2px 0}
.tiny:hover{color:var(--accent);text-decoration:underline}
.badge-ex{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);border:1px solid var(--line-2);border-radius:999px;padding:1px 8px}
.empty{border:1px dashed var(--line-2);border-radius:var(--radius);padding:24px;color:var(--ink-3);font-size:14px;text-align:center}

/* books shelf */
.books{margin-top:48px;padding-top:34px;border-top:1px solid var(--line)}
.books.solo{margin-top:0;padding-top:0;border-top:0}
.bookshead{display:flex;gap:18px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}
.bookshead .en{color:var(--sage);font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:500}
.bookshead h2{margin:2px 0 0;font-family:Fraunces,Georgia,serif;font-size:27px;font-weight:600;letter-spacing:-.01em}
.bookshead p{margin:5px 0 0;color:var(--ink-2);font-size:14px;max-width:56ch}
.bookkinds{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 20px}
.bookgrid{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(184px,1fr))}
.bookcard{display:flex;flex-direction:column;gap:10px}
.bcover{
  position:relative;aspect-ratio:2/3;border-radius:3px 6px 6px 3px;overflow:hidden;
  background:var(--surface-2);display:grid;place-items:center;
  box-shadow:0 1px 2px rgba(52,37,42,.08), 0 14px 26px -16px rgba(52,37,42,.6);
}
.bcover img{width:100%;height:100%;object-fit:cover;display:block}
.bcover::after{
  content:"";position:absolute;left:0;top:0;bottom:0;width:9px;pointer-events:none;
  background:linear-gradient(to right, rgba(0,0,0,.20), rgba(0,0,0,.05) 55%, rgba(255,255,255,.10));
}
.bcover .mono{font-size:34px}
.bkind{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--sage);font-weight:500}
.btitle{margin:0;font-weight:600;font-size:14.5px;line-height:1.35}
.bauthor{margin:0;font-size:12.5px;color:var(--ink-3);font-family:Fraunces,Georgia,serif;font-style:italic}
.bnote{margin:0;font-size:12.5px;color:var(--ink-2)}
.bage{display:inline-block;font-size:11px;color:var(--accent);border:1px solid var(--line-2);border-radius:999px;padding:1px 9px}
.booksempty{border:1px dashed var(--line-2);border-radius:var(--radius);padding:26px;color:var(--ink-3);font-size:14px;text-align:center}

/* edit-text mode */
.editbar{
  position:sticky;top:52px;z-index:39;margin:14px 0 0;padding:10px 15px;
  background:var(--accent-soft);border:1px solid var(--line-2);border-radius:var(--radius);
  display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13.5px;
}
body.editing [data-k],body.editing [data-p]{
  outline:1px dashed var(--line-2);outline-offset:3px;border-radius:3px;cursor:text;
}
body.editing [data-k]:hover,body.editing [data-p]:hover{outline-color:var(--accent);background:var(--accent-soft)}
body.editing [data-k]:focus,body.editing [data-p]:focus{outline:2px solid var(--accent);background:var(--surface)}
body.editing .card:hover{transform:none}
body.editing a.shop{pointer-events:none;opacity:.5}

/* modal */
.scrim{position:fixed;inset:0;z-index:90;background:rgba(40,28,32,.55);display:grid;place-items:center;padding:16px;overflow:auto}
.sheet{background:var(--surface);border-radius:18px;border:1px solid var(--line);width:min(620px,100%);padding:24px;box-shadow:0 34px 74px -34px rgba(0,0,0,.7)}
.sheet h3{margin:0 0 3px;font-family:Fraunces,Georgia,serif;font-size:25px;font-weight:600}
.sheet .sub{margin:0 0 18px;color:var(--ink-3);font-size:13px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.field label{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.field input,.field select,.field textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:100%}
.field textarea{resize:vertical;min-height:56px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.stagepick{display:flex;flex-wrap:wrap;gap:6px}
.chk{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--ink-2);background:var(--paper)}
.chk[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.preview{display:flex;gap:13px;align-items:center}
.preview .icon{width:76px;height:76px;flex:0 0 76px;border-radius:10px;border:1px solid var(--line)}
.sheetfoot{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.err{color:var(--accent);font-size:12.5px;margin:6px 0 0}

footer{border-top:1px solid var(--line);padding:24px 0 44px;color:var(--ink-3);font-size:12.5px}
footer p{margin:0 0 7px;max-width:72ch}

@media (max-width:640px){
  .stage{grid-template-columns:100px minmax(0,1fr)}
  .rail{gap:12px}
  .rail::before{left:21px}
  .rail::after{left:12px}
  .notch{width:42px;height:42px;box-shadow:0 0 0 4px var(--paper)}
  .notch b{font-size:14px}
  .notch span{display:none}
  .polaroid{width:92px;padding:6px 6px 7px}
  .polaroid figcaption{font-size:10px;margin-top:5px}
  .photodrop{width:92px;min-height:84px;font-size:11px;padding:7px}
  .two{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:11px}
  .bookgrid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}
  .editbar{top:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.follow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.follow a{text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 15px;font-size:13.5px;color:var(--ink-2)}
.follow a:hover{border-color:var(--accent);color:var(--accent)}
</style>

  var price="";
  if(d.priceNow||d.priceWas){price='<div class="priceline">'+(d.priceNow?'<span class="pricenow">฿'+esc(d.priceNow)+'</span>':"")+
    (d.priceWas?'<span class="pricewas">฿'+esc(d.priceWas)+'</span>':"")+'</div><p class="pricenote">'+
    (en?"Price seen when saved — check the shop again.":"ราคาที่เห็นตอนบันทึก เช็กหน้าร้านอีกครั้งนะคะ")+'</p>';}
  return '<article class="card dealcard"><span class="dealtag">'+esc(countdown(d))+'</span>'+
    '<div class="icon"><div class="frame">'+inner+'</div></div><div class="cbody">'+
    '<p class="cname">'+esc(d.title)+'</p>'+price+
    (d.code?'<div><span class="dealcode">'+esc(d.code)+'</span></div>':"")+
    (d.note?'<p class="cnote">'+esc(d.note)+'</p>':"")+
    (shopLinks(d)?'<div class="links">'+shopLinks(d)+'</div>':"")+'</div></article>';
}
function deals(){
  var h=document.getElementById("deal"),en=lang==="en",L=live();
  h.innerHTML='<div class="sectionhead"><div class="en">'+esc(lbl("deal.eyebrow",en?"Right now":"ช่วงนี้"))+'</div>'+
    '<h2>'+esc(lbl("deal.title",en?"This month\u2019s deals":"ดีลเดือนนี้"))+'</h2>'+
    '<p>'+esc(lbl("deal.note",en?"Only things we\u2019d buy anyway, that happen to be cheap right now. Deals disappear on their own when they end.":"เฉพาะของที่เราจะซื้ออยู่แล้วและบังเอิญลดราคาช่วงนี้ พอหมดเวลาดีลจะหายไปเอง"))+'</p></div>'+
    '<div class="grid" style="margin-top:22px">'+L.map(dealCard).join("")+'</div>';
  h.querySelectorAll("img").forEach(function(im){im.onerror=function(){im.parentNode.innerHTML='<span class="mono">?</span>';};});
}
function pick(a,id,k){for(var i=0;i<a.length;i++){if(a[i].id===id)return lbl(k+"."+id,lang==="en"?a[i].en:a[i].th);}return "";}
function shopLinks(o){var s="";
  if(o.shopee)s+='<a class="shop sp" href="'+esc(o.shopee)+'" target="_blank" rel="noopener nofollow sponsored"><i class="dot"></i>Shopee</a>';
  if(o.lazada)s+='<a class="shop lz" href="'+esc(o.lazada)+'" target="_blank" rel="noopener nofollow sponsored"><i class="dot"></i>Lazada</a>';
  return s;}
function getTicks(){try{return JSON.parse(localStorage.getItem("pynta.ticks")||"{}");}catch(e){return {};}}
function setTick(id,on){try{var m=getTicks();if(on)m[id]=1;else delete m[id];localStorage.setItem("pynta.ticks",JSON.stringify(m));}catch(e){}}
function counts(){return {shelf:P.length,prep:CL.length,gift:GF.length,books:BK.length,deal:live().length};}
function tabs(){
  var h=document.getElementById("tabs");if(!h)return;
  var c=counts();
  var av=TB.filter(function(x){return c[x.id]>0;});
  if(av.length<2){h.style.display="none";tab=av.length?av[0].id:"shelf";panels();return;}
  h.innerHTML=av.map(function(x){
    return '<button class="tab" type="button" role="tab" data-tab="'+x.id+'" aria-selected="'+(tab===x.id?"true":"false")+'">'+
      esc(lbl("tab."+x.id,lang==="en"?x.en:x.th))+'<span class="n">'+c[x.id]+'</span></button>';}).join("");
  h.querySelectorAll("[data-tab]").forEach(function(b){b.onclick=function(){tab=b.getAttribute("data-tab");tabs();};});
  panels();
}
function panels(){
  document.getElementById("controls").hidden=tab!=="shelf";
  document.getElementById("stages").hidden=tab!=="shelf";
  document.getElementById("deal").hidden=tab!=="deal";
  document.getElementById("prep").hidden=tab!=="prep";
  document.getElementById("gift").hidden=tab!=="gift";
  document.getElementById("books").hidden=tab!=="books";
  banner();
  if(tab==="shelf")render();if(tab==="deal")deals();if(tab==="prep")prep();
  if(tab==="gift")gifts();if(tab==="books")books();
}
function prep(){
  var h=document.getElementById("prep"),en=lang==="en",tk=getTicks();
  var total=CL.length,done=CL.filter(function(c){return tk[c.id];}).length;
  var pct=total?Math.round(done/total*100):0;
  var groups=GR.map(function(g){
    var rows=CL.filter(function(c){return c.group===g.id;});if(!rows.length)return "";
    return '<div class="clgroup"><h3>'+esc(pick(GR,g.id,"group"))+'</h3>'+rows.map(function(c){
      var on=!!tk[c.id];
      return '<div class="clrow'+(on?" done":"")+'"><button class="clbox" type="button" data-tick="'+esc(c.id)+'" aria-pressed="'+(on?"true":"false")+'" aria-label="tick">✓</button>'+
        '<div class="clmain"><p class="cltitle">'+esc(c.title)+'</p>'+(c.note?'<p class="clnote">'+esc(c.note)+'</p>':"")+'</div>'+
        '<div class="clside">'+shopLinks(c)+'</div></div>';}).join("")+'</div>';}).join("");
  var skips=SK.length?'<div class="skiplist">'+SK.map(function(s){
    return '<div class="skiprow"><h4>'+esc(s.title)+'</h4>'+(s.why?'<p>'+esc(s.why)+'</p>':"")+
      (s.instead?'<p class="skipinstead">'+(en?"Instead: ":"ทำแบบนี้แทน: ")+esc(s.instead)+'</p>':"")+'</div>';}).join("")+'</div>':"";
  h.innerHTML='<div class="sectionhead"><div class="en">'+esc(lbl("prep.eyebrow",en?"Before baby":"ก่อนคลอด"))+'</div>'+
    '<h2>'+esc(lbl("prep.title",en?"What to get ready":"เช็กลิสต์ของเตรียมคลอด"))+'</h2>'+
    '<p>'+esc(lbl("prep.note",en?"Tick things off as you get them — your ticks are remembered on this device.":"ติ๊กไปเรื่อย ๆ ตามที่เตรียมได้ ระบบจำไว้ให้ในเครื่องนี้ ปิดแล้วเปิดใหม่ก็ยังอยู่"))+'</p></div>'+
    (total?'<div class="progwrap"><div class="progbar"><i style="width:'+pct+'%"></i></div><span class="progtext">'+done+' / '+total+' '+(en?"ready":"เตรียมแล้ว")+'</span>'+
      (done?'<button class="btn btn-ghost" id="clReset" type="button">'+(en?"Clear ticks":"ล้างที่ติ๊กไว้")+'</button>':"")+'</div>':"")+groups+
    (skips?'<div class="sectionhead" style="margin-top:52px"><div class="en">'+esc(lbl("skip.eyebrow",en?"Honest list":"พูดกันตรง ๆ"))+'</div>'+
      '<h2>'+esc(lbl("skip.title",en?"Things we bought and never used":"ของที่ซื้อมาแล้วไม่ได้ใช้"))+'</h2>'+
      '<p>'+esc(lbl("skip.note",en?"So you can skip what we wasted money on.":"จะได้ไม่ต้องเสียเงินซ้ำรอยเรา"))+'</p></div>'+skips:"");
  h.querySelectorAll("[data-tick]").forEach(function(b){b.onclick=function(){
    setTick(b.getAttribute("data-tick"),b.getAttribute("aria-pressed")!=="true");prep();};});
  var r=document.getElementById("clReset");
  if(r)r.onclick=function(){try{localStorage.removeItem("pynta.ticks");}catch(e){}prep();};
}
function giftCard(g){
  var ini=(g.title||"?").trim().charAt(0).toUpperCase();
  var inner=g.imgUrl?'<img src="'+esc(g.imgUrl)+'" alt="'+esc(g.title)+'" loading="lazy" referrerpolicy="no-referrer">':'<span class="mono">'+esc(ini)+'</span>';
  return '<article class="card"><div class="icon"><div class="frame">'+inner+'</div></div><div class="cbody">'+
    '<div class="cat">'+esc(pick(OC,g.occasion,"occ"))+'</div><p class="cname">'+esc(g.title)+'</p>'+
    (g.note?'<p class="cnote">'+esc(g.note)+'</p>':"")+
    (shopLinks(g)?'<div class="links">'+shopLinks(g)+'</div>':"")+'</div></article>';
}
function gifts(){
  var h=document.getElementById("gift"),en=lang==="en";
  var list=GF.filter(function(g){return gocc==="all"||g.occasion===gocc;});
  var used=OC.filter(function(o){return GF.some(function(g){return g.occasion===o.id;});});
  var chips='<div class="bookkinds">'+["all"].concat(used.map(function(o){return o.id;})).map(function(id){
    var label=id==="all"?t("all"):pick(OC,id,"occ");
    return '<button class="pill" type="button" data-occ="'+id+'" aria-pressed="'+(gocc===id?"true":"false")+'">'+esc(label)+'</button>';}).join("")+'</div>';
  var by=BD.map(function(bd){var rows=list.filter(function(g){return g.budget===bd.id;});if(!rows.length)return "";
    return '<div class="giftbudget"><h3>'+esc(pick(BD,bd.id,"budget"))+'<small>'+rows.length+' '+(en?"ideas":"ไอเดีย")+'</small></h3>'+
      '<div class="grid">'+rows.map(giftCard).join("")+'</div></div>';}).join("");
  h.innerHTML='<div class="sectionhead"><div class="en">'+esc(lbl("gift.eyebrow",en?"Gift guide":"ไอเดียของขวัญ"))+'</div>'+
    '<h2>'+esc(lbl("gift.title",en?"Gifts for a new baby":"ของขวัญเยี่ยมคลอด & วันเกิด"))+'</h2>'+
    '<p>'+esc(lbl("gift.note",en?"Sorted by budget, so you can pick and go.":"จัดตามงบ เลือกได้เลยไม่ต้องคิดนาน"))+'</p></div>'+
    (used.length>1?chips:"")+by;
  h.querySelectorAll("[data-occ]").forEach(function(b){b.onclick=function(){gocc=b.getAttribute("data-occ");gifts();};});
  h.querySelectorAll("img").forEach(function(im){im.onerror=function(){im.parentNode.innerHTML='<span class="mono">?</span>';};});
}
var lang="th",stage="all",cat="all",q="";
var $=function(s){return document.querySelector(s);};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function lbl(k,f){var o=LB[k];if(o&&o[lang])return o[lang];return f;}
function t(k){return lbl("ui."+k,T[lang][k]);}
function sName(s){return lbl("stage."+s.id+".name",lang==="en"?s.en:s.th);}
function sAlt(s){return lbl("stage."+s.id+".alt",lang==="en"?s.th:s.en);}
function sNote(s){return lbl("stage."+s.id+".note",lang==="en"?s.noteEn:s.noteTh);}
function catName(id){for(var i=0;i<C.length;i++){if(C[i].id===id)return lbl("cat."+id,lang==="en"?C[i].en:C[i].th);}return "";}
function chrome(){
  var title=lbl("ui.title",SET.title);
  $("#pTitle").innerHTML=esc(title).replace(/\s(\S+)$/," <em>$1<\/em>");
  $("#pTag").textContent=lbl("ui.tagline",SET.tagline);
  $("#pSub").textContent=lbl("ui.sub",T[lang].sub);
  $("#lProd").textContent=t("items");$("#lStage").textContent=t("stagesCovered");$("#lCat").textContent=t("cats");
  $("#search").placeholder=t("search");
  $("#langBtn").textContent=lang==="th"?"EN":"ไทย";
  $("#pDisc").textContent=t("disc");
  $("#pFoot").textContent=title+" · "+t("foot2");
  document.documentElement.lang=lang;
  var f=[["Instagram",SET.ig],["TikTok",SET.tiktok],["YouTube",SET.youtube],["Facebook",SET.facebook]];
  $("#pFollow").innerHTML=f.filter(function(x){return x[1];}).map(function(x){
    return '<a href="'+esc(x[1])+'" target="_blank" rel="noopener">'+x[0]+'</a>';}).join("");
}
function filters(){
  var ps=$("#stagePills");ps.innerHTML="";
  var mk=function(id,label){var b=document.createElement("button");b.className="pill";b.type="button";
    b.textContent=label;b.setAttribute("aria-pressed",stage===id?"true":"false");
    b.onclick=function(){stage=id;filters();render();};ps.appendChild(b);};
  mk("all",t("all"));S.forEach(function(s){mk(s.id,sName(s));});
  var sel=$("#catSel");sel.innerHTML="";sel.add(new Option(t("allCats"),"all"));
  C.forEach(function(c){sel.add(new Option(catName(c.id),c.id));});
  sel.value=cat;sel.onchange=function(){cat=sel.value;render();};
}
function kindName(id){for(var i=0;i<KD.length;i++){if(KD[i].id===id)return lbl("kind."+id,lang==="en"?KD[i].en:KD[i].th);}return "";}
function bookCard(b){
  var title=lang==="en"?(b.titleEn||b.title):(b.title||b.titleEn);
  var alt=lang==="en"?(b.title||""):(b.titleEn||"");
  var ini=(title||"?").trim().charAt(0).toUpperCase();
  var src=b.img||b.imgUrl||"";
  var cover=src?'<img src="'+esc(src)+'" alt="'+esc(title)+'" loading="lazy" referrerpolicy="no-referrer">':'<span class="mono">'+esc(ini)+'</span>';
  var L="";
  if(b.shopee)L+='<a class="shop sp" href="'+esc(b.shopee)+'" target="_blank" rel="noopener nofollow sponsored"><i class="dot"></i>Shopee</a>';
  if(b.lazada)L+='<a class="shop lz" href="'+esc(b.lazada)+'" target="_blank" rel="noopener nofollow sponsored"><i class="dot"></i>Lazada</a>';
  return '<article class="bookcard"><div class="bcover">'+cover+'</div>'+
    '<div style="display:flex;flex-direction:column;gap:5px">'+
    '<div class="bkind">'+esc(kindName(b.kind))+'</div><p class="btitle">'+esc(title)+'</p>'+
    (alt?'<p class="bauthor">'+esc(alt)+'</p>':"")+
    (b.author?'<p class="bauthor">'+esc(b.author)+'</p>':"")+
    (b.age?'<div><span class="bage">'+esc(b.age)+'</span></div>':"")+
    (b.note?'<p class="bnote">'+esc(b.note)+'</p>':"")+
    (L?'<div class="links">'+L+'</div>':"")+'</div></article>';
}
function books(){
  var h=document.getElementById("books");if(!h)return;
  if(!BK.length){h.innerHTML="";h.style.display="none";return;}
  var list=BK.filter(function(b){return bkind==="all"||b.kind===bkind;});
  var used=KD.filter(function(k){return BK.some(function(b){return b.kind===k.id;});});
  var kinds='<div class="bookkinds">'+["all"].concat(used.map(function(k){return k.id;})).map(function(id){
    var label=id==="all"?t("all"):kindName(id);
    return '<button class="pill" type="button" data-bk="'+id+'" aria-pressed="'+(bkind===id?"true":"false")+'">'+esc(label)+'</button>';
  }).join("")+'</div>';
  h.innerHTML='<div class="bookshead"><div><div class="en">'+esc(lbl("books.eyebrow",lang==="en"?"Reading shelf":"ชั้นหนังสือ"))+'</div>'+
    '<h2>'+esc(lbl("books.title",lang==="en"?"Books worth reading":"หนังสือแนะนำ"))+'</h2>'+
    '<p>'+esc(lbl("books.note",lang==="en"?"Books on child development and day-to-day care that we actually read.":"หนังสือเรื่องพัฒนาการเด็กและการดูแลลูก ที่เราอ่านเองแล้วได้ประโยชน์จริง"))+'</p></div></div>'+
    (used.length>1?kinds:"")+'<div class="bookgrid">'+list.map(bookCard).join("")+'</div>';
  h.querySelectorAll("[data-bk]").forEach(function(x){x.onclick=function(){bkind=x.getAttribute("data-bk");books();};});
  h.querySelectorAll("img").forEach(function(im){im.onerror=function(){im.parentNode.innerHTML='<span class="mono">?</span>';};});
}
function pol(s){var im=PH[s.id];if(!im)return "";
  return '<figure class="polaroid"><img src="'+esc(im)+'" alt="'+esc(sName(s))+'" loading="lazy">'+
    '<figcaption>'+esc(sName(s))+'</figcaption></figure>';}
function cover(){var h=document.getElementById("cover");if(!h)return;
  h.innerHTML=PH.cover?'<div class="coverframe"><img src="'+esc(PH.cover)+'" alt=""></div>':"";}
function match(p){
  if(cat!=="all"&&p.cat!==cat)return false;
  if(q){var h=((p.nameTh||"")+" "+(p.nameEn||"")+" "+(p.brand||"")+" "+(p.note||"")).toLowerCase();
    if(h.indexOf(q.toLowerCase())<0)return false;}
  return true;
}
function card(p){
  var name=lang==="en"?(p.nameEn||p.nameTh):(p.nameTh||p.nameEn);
  var alt=lang==="en"?(p.nameTh||""):(p.nameEn||"");
  var ini=(name||"?").trim().charAt(0).toUpperCase();
  var src=p.img||p.imgUrl||"";
  var inner=src?'<img src="'+esc(src)+'" alt="'+esc(name)+'" loading="lazy" referrerpolicy="no-referrer">':'<span class="mono">'+esc(ini)+'</span>';
  var L="";
  if(p.shopee)L+='<a class="shop sp" href="'+esc(p.shopee)+'" target="_blank" rel="noopener nofollow sponsored"><i class="dot"></i>Shopee</a>';
  if(p.lazada)L+='<a class="shop lz" href="'+esc(p.lazada)+'" target="_blank" rel="noopener nofollow sponsored"><i class="dot"></i>Lazada</a>';
  return '<article class="card"><div class="icon"><div class="frame">'+inner+'</div></div><div class="cbody">'+
    '<div class="cat">'+esc(catName(p.cat))+(p.brand?" · "+esc(p.brand):"")+'</div>'+
    '<p class="cname">'+esc(name)+'</p>'+(alt?'<p class="cen">'+esc(alt)+'</p>':"")+
    (p.note?'<p class="cnote">'+esc(p.note)+'</p>':"")+
    (L?'<div class="links">'+L+'</div>':"")+'</div></article>';
}
function render(){
  var list=P.filter(match);
  var shown=S.filter(function(s){return stage==="all"||stage===s.id||s.any;});
  $("#stages").innerHTML=shown.map(function(s){
    var it=list.filter(function(p){return (p.stages||[]).indexOf(s.id)>=0;});
    var body=it.length?'<div class="grid">'+it.map(card).join("")+'</div>':'<div class="empty">'+esc(t("empty"))+'</div>';
    var u=lang==="en"?(s.unitEn||(s.unit==="ปี"?"yr":"mo")):s.unit;
    return '<section class="stage'+(s.any?" anystage":"")+'" id="'+s.id+'"><div class="rail"><div class="notch"><b>'+esc(s.mark)+'</b>'+
      '<span>'+esc(u)+'</span></div>'+pol(s)+'</div><div><div class="stagehead"><div class="stagetext">'+
      '<div class="en">'+esc(sAlt(s))+'</div><h2>'+esc(sName(s))+'</h2><p>'+esc(sNote(s))+'</p></div>'+
      '</div>'+body+'</div></section>';
  }).join("");
  $("#stages").querySelectorAll("img").forEach(function(im){
    im.onerror=function(){im.parentNode.innerHTML='<span class="mono">?</span>';};});
  $("#cProd").textContent=P.length;
  $("#cStage").textContent=S.filter(function(s){return !s.any&&P.some(function(p){return (p.stages||[]).indexOf(s.id)>=0;});}).length;
  var seen={},n=0;P.forEach(function(p){if(p.cat&&!seen[p.cat]){seen[p.cat]=1;n++;}});
  $("#cCat").textContent=n;
}
$("#langBtn").onclick=function(){lang=lang==="th"?"en":"th";chrome();filters();tabs();};
$("#search").oninput=function(e){q=e.target.value;render();};
chrome();cover();filters();tabs();
})();
</script>
</body>
</html>
